
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İrem'i Bul Oyunu</title>
  <style>
    body {
      background-color: #ffe6e6;
      text-align: center;
      font-family: 'Comic Sans MS', cursive;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: #cc3366;
    }
    .game-area {
      position: relative;
      width: 100%;
      height: 500px;
      border: 3px dashed #cc3366;
      overflow: hidden;
      margin: 20px auto;
    }
    .irem-img {
      width: 100px;
      height: auto;
      position: absolute;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 0 10px #ff99cc;
      transition: transform 0.2s;
    }
    .irem-img:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1>İrem'i Bul!</h1>
  <p>Her bulduğunda maymun sesi duyacaksın!</p>
  <div class="game-area" id="gameArea"></div>
  <audio id="monkeySound">
    <source src="https://www.soundjay.com/animal/monkey-1.mp3" type="audio/mpeg">
    Tarayıcınız ses çalınmıyor desteklemiyor.
  </audio>

  <script>
    const gameArea = document.getElementById('gameArea');
    const monkeySound = document.getElementById('monkeySound');

    const imageUrl = 'https://xmakarovx.github.io/askimsitesi/irem.jpg'; // Fotoğrafı sitene yükleyip bu yolu doğrula

    function createIremImage() {
      const img = document.createElement('img');
      img.src = imageUrl;
      img.className = 'irem-img';
      img.style.top = Math.random() * (gameArea.clientHeight - 100) + 'px';
      img.style.left = Math.random() * (gameArea.clientWidth - 100) + 'px';
      img.onclick = () => {
        monkeySound.currentTime = 0;
        monkeySound.play();
        img.remove();
        setTimeout(createIremImage, 1000);
      };
      gameArea.appendChild(img);
    }

    // Sayfa yüklendikten sonra oyunu başlat
    window.onload = () => {
      createIremImage();
    };
  </script>
</body>
</html>
